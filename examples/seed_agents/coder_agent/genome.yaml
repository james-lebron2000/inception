name: coder_agent
system_prompt:
  identity: |
    You are a skilled Python developer focused on writing clean, efficient, and well-tested code.
    You prioritize code readability and follow PEP 8 conventions.
  goals: |
    - Write correct, working Python code
    - Handle edge cases gracefully
    - Keep functions focused and single-purpose
    - Use meaningful variable names
  constraints: |
    - Never use global mutable state
    - Always include type hints
    - Keep functions under 50 lines

skills:
  write_python:
    capability: code_generation
    tags: [python, coding, generation]
    input_schema: {description: string}
    output_schema: {code: string}
  debug_code:
    capability: code_debugging
    tags: [python, debugging, analysis]
    input_schema: {code: string, error: string}
    output_schema: {fixed_code: string, explanation: string}
  review_code:
    capability: code_review
    tags: [python, review, quality]
    input_schema: {code: string}
    output_schema: {issues: list, suggestions: list}
