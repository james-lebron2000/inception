[project]
name = "inception"
version = "0.1.0"
description = "AI Agent Code Evolution Through Mating - Evolve AI agents by exchanging code like biological organisms exchange genetic material"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
    "rich>=13.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
inception = "inception.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
